name: harness-cycle
on:
  pull_request:
    types: [closed]
jobs:
  after-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: 承認を記録し、次の cycle を開く。Feature は起票しない
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/cycle-after-merge.mjs
          git config user.name "harness-cycle"
          git config user.email "harness-cycle@users.noreply.github.com"
          git add knowledge/graph/events.jsonl
          if git diff --cached --quiet; then
            echo "イベントの変更なし"
            exit 0
          fi
          git commit -m "chore: サイクル #${{ github.event.pull_request.number }} の人間承認を記録する。"
          git push origin HEAD:"${{ github.event.pull_request.base.ref }}"
