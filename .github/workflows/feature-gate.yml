name: feature-gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: feature-gate を実行する（main に載った後は main の policy）
        run: |
          set -euo pipefail
          if git cat-file -e origin/main:policy/grow.rego 2>/dev/null; then
            tmp="$(mktemp -d)"
            git archive origin/main policy scripts | tar -x -C "$tmp"
            HARNESS_ROOT="$GITHUB_WORKSPACE" OPA_POLICY_DIR="$tmp/policy" \
              node "$tmp/scripts/feature-gate.mjs"
          else
            node scripts/feature-gate.mjs
          fi
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate && pnpm install --frozen-lockfile
      - name: 契約の型と振る舞い
        run: node scripts/contract-check.mjs
      - name: レビュー起動の上限
        run: node scripts/review-cap-check.mjs
      - name: ハーネス単体テスト
        run: node --test scripts/cycle-metrics.test.mjs scripts/commit-msg-lint.test.mjs scripts/git-commit-cmd.test.mjs scripts/commit-guard.test.mjs scripts/blocked-env.test.mjs scripts/lint-commit-range.test.mjs scripts/knowledge-catalog.test.mjs scripts/code-mode.test.mjs scripts/harness-query.test.mjs scripts/packet-policy.test.mjs scripts/license-readme.test.mjs scripts/review-contract.test.mjs scripts/read-guard.test.mjs scripts/file-window.test.mjs scripts/observation-fold.test.mjs scripts/contract-check.test.mjs scripts/review-cap.test.mjs scripts/review-disposition.test.mjs
      - name: 三層知識カタログの鮮度と OPA 突合
        run: |
          set -euo pipefail
          test -x .tools/opa
          catalog_script="scripts/knowledge-catalog.mjs"
          opa_test="scripts/knowledge-catalog.opa.test.mjs"
          if git cat-file -e origin/main:scripts/knowledge-catalog.mjs 2>/dev/null; then
            tmp="$(mktemp -d)"
            git archive origin/main scripts | tar -x -C "$tmp"
            catalog_script="$tmp/scripts/knowledge-catalog.mjs"
            opa_test="$tmp/scripts/knowledge-catalog.opa.test.mjs"
          fi
          HARNESS_ROOT="$GITHUB_WORKSPACE" node "$catalog_script" --check
          HARNESS_ROOT="$GITHUB_WORKSPACE" node --test "$opa_test"
      - name: コミット主語を検査する
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          lint_script="scripts/lint-commit-range.mjs"
          if git cat-file -e origin/main:scripts/lint-commit-range.mjs 2>/dev/null; then
            tmp="$(mktemp -d)"
            git archive origin/main scripts | tar -x -C "$tmp"
            lint_script="$tmp/scripts/lint-commit-range.mjs"
          fi
          if [ -n "${PR_HEAD}" ]; then
            node "$lint_script" --tip "${PR_HEAD}"
          else
            node "$lint_script" --tip
          fi
