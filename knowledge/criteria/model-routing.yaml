# ハーネス席 — ADR 0031 / 0033 / 0037 / 0039 / 0040 / 0046 / 0047 / 0049
# 親も Task も grok-4.7-high。cursor- 接頭辞は 4.7 で消えた。
# fast / xhigh / 裸の grok-4.7 はピンにも予備にも書かない（[[0049]]）。
# 第3は medium を明示する。Muse の公式既定 high には上げない。
# 計画とレビューは Fable 5.1 high。verifier / reflector は Opus 5.5 high。
harness_agents:
  chat_orchestrator: grok-4.7-high
  grok_task: grok-4.7-high
  fable_gates:
    - plan-confirm
    - review_default
  opus_gates:
    - verifier
    - reflector
  review_trio:
    - model: claude-fable-5-1-thinking-high
    - model: grok-4.7-high
    - model: muse-spark-1.3-medium
  sonnet_pin: claude-sonnet-5-thinking-high
  fable_pin: claude-fable-5-1-thinking-high
  budget_guards:
    parent_chat: grok-only
    gate_input: artifacts-only
    third_lens_seat: review_trio_only
    no_sol_terra_luna: true
    fable_seat: plan-confirm-and-review
    opus_seat: verify-and-reflect
    trio_when: high-risk-only
    plan_confirm_when: before-fanout-only
    no_generic_task_as_gate: true
    no_fable_opus_cohabit_trio: true
    fable_guardrail_fallback_is_fail: true
# 親と実装の既定は high（[[0049]]）。medium は許可に残し、ピンにはしない。
# 0044 の「high-fast しか無い」例外は消滅した。fast はピンにしない。
# 幅1の上書きは packet.rego が deny。ゲートを親が下げることも不可。
effort_defaults:
  parent: high
  implement: high
  gate: high
  third: medium
  ceiling: high
effort_allow:
  parent:
    - medium
    - high
  implement:
    - medium
    - high
  gate:
    - high
  third:
    - medium
  ceiling:
    - high
escalate:
  - stay
  - trio
  - ceiling
  - human
context_mode:
  - isolated
  - packet
dispatch_seats:
  parent: grok
  implement: grok
  plan_confirm: fable
  review: fable
  review_trio:
    - fable
    - grok
    - muse
  verify: opus
  reflect: opus
  third: muse
  harness_grow: fable
