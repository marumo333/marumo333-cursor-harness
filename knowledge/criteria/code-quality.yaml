# コード品質バー — ハーネス テンプレート。出典: ADR 0013-0016 / 0038 / 0039
# キー名は機械参照用。
level: pragmatic-balance # 実用バランス

tdd_required_for: # TDD 必須領域
  - feature_gate
  - cycle_metrics
  - opa_policy
  - harness_behavior_change # ハーネスの観測可能挙動

tdd_process:
  red_before_green: required # 赤を先に観測
  red_evidence: node_test_fail_log

tdd_exceptions: # 人間が明示する例外
  - docs_only # 文書のみ
  - style_only_no_behavior # 挙動なしの体裁
  - snapshot_baseline_import
  - config_chore # 設定の雑務
  - retrofit_with_human_ack # 後付けを人間が認める

testing:
  unit: node:test
  opa: policy/*_test.rego

definition_of_done:
  - feature_opa_gate # node scripts/feature-gate.mjs（ADR 0038）
  - harness_tests_green # pnpm test（cycle 指標）
  - tdd_red_evidence_or_exception
  - secret_scan_pass
  - review_pass # 独立敵対レビュー（高リスクは Fable/Grok/Muse 3体1周。再レビューは差し戻す指摘と修正差分の1回）
  - plan_confirm_if_fanout
  - learnings_appended
  - cycle_skills_recorded # 必須 skill の used/skipped（ADR 0039）
  - commit_hook_and_ja_conventional # pre-commit 必須・主語は日本語 prefix（ADR 0042）

naming:
  files: kebab-case
  types: PascalCase
  features: 'F-NNNN-slug.yaml'
  cycles: 'C-NNNN'
