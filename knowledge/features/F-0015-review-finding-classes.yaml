  problem: >
    指摘を直すたびに差分全体を新しい文脈でレビューし、3体が何周も回る。
    手順が「問題が見つからない場合のみ承認」と「同じ手順で再レビュー」になっている。
    差し戻す指摘、記録だけ、確認できない指摘を分け、再レビューは差し戻した項目と
    修正差分の1回にする。3体のやり直しはしない。文書だけでコード差分が無いときは
    Task を出さない。適用は F-0001 被覆。本票は proposed のまま。入場しない。
